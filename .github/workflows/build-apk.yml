name: Build WirelessDataManager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack v0.3.1 project
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'WirelessDataManager-v0.3.1-src*.zip' | head -n 1)"

          echo "Using ZIP: $ZIP_FILE"

          if [ -z "$ZIP_FILE" ]; then
            echo "WirelessDataManager v0.3.1 source ZIP not found"
            exit 1
          fi

          rm -rf buildsrc
          mkdir -p buildsrc

          unzip -q "$ZIP_FILE" -d buildsrc

          echo "=== Extracted files ==="
          find buildsrc -maxdepth 3 -type f | head -100

          if [ ! -f buildsrc/WirelessDataManager/settings.gradle ]; then
            echo "settings.gradle not found"
            echo "Extracted directory structure:"
            find buildsrc -maxdepth 3 -type d
            exit 1
          fi

      - name: Build debug APK
        working-directory: buildsrc/WirelessDataManager
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="buildsrc/WirelessDataManager/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK build output not found"
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WirelessDataManager-v0.3.1-debug
          path: buildsrc/WirelessDataManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
