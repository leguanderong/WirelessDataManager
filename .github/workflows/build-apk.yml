name: Build WirelessDataManager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack project
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'WirelessDataManager-v0.2-src*.zip' | head -n 1)"
          test -n "$ZIP_FILE"
          mkdir buildsrc
          unzip -q "$ZIP_FILE" -d buildsrc
          test -f buildsrc/WirelessDataManager/settings.gradle

      - name: Build debug APK
        working-directory: buildsrc/WirelessDataManager
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WirelessDataManager-v0.2-debug
          path: buildsrc/WirelessDataManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
